# 项目名由 Makefile 通过 -p irp-dev 传入：顶层 name 字段需要 compose v2.3+，
# 而部分开发机上的版本更老
services:
  postgres:
    # pgvector 官方镜像 = 原版 Postgres + vector 扩展，版本与生产保持一致
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: irp
      POSTGRES_DB: irp
      # 中文全文检索与排序依赖，显式指定避免跟随宿主机 locale
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 与 Redis 同理：开发机常已有原生 Postgres 占用 5432，且它会先于容器
      # 被 localhost 解析命中，导致连上错误的库还很难看出来
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 仅在数据目录为空时执行一次，用于创建非超级用户的应用角色
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irp -d irp"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      # 开发机内存有限，但 HNSW 建索引需要足够的 maintenance 内存
      - -c
      - maintenance_work_mem=256MB

  redis:
    image: redis:7-alpine
    ports:
      # 宿主机侧避开 6379：开发机上常已有别的 Redis 占用默认端口。
      # 容器内仍是 6379，对应 backend/.env.example 里的 IRP_REDIS_URL
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/irp-documents &&
      printf '%s' '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","POST","HEAD","DELETE"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","Content-Length"],"MaxAgeSeconds":3600}]}' > /tmp/cors.json &&
      mc cors set local/irp-documents /tmp/cors.json &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
