name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest --cov=app --cov-fail-under=70
      - name: Export OpenAPI
        run: uv run python -m scripts.export_openapi ../frontend/src/types/openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # OpenAPI 由 backend job 生成；此处重新导出以校验契约未漂移
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (for OpenAPI export)
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Regenerate OpenAPI types
        run: |
          cd ../backend && uv run python -m scripts.export_openapi ../frontend/src/types/openapi.json
          cd ../frontend && pnpm install --frozen-lockfile
          pnpm exec openapi-typescript src/types/openapi.json -o src/types/openapi.gen.ts
      - name: Lint & typecheck
        run: pnpm lint && pnpm typecheck
      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t irp-api:${{ github.sha }} .
      - name: Build Web image
        run: docker build -f deploy/Dockerfile.web -t irp-web:${{ github.sha }} .
