[project]
name = "industry-rag-platform"
version = "0.1.0"
description = "面向多行业的工业知识库平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "celery>=5.4",
    "structlog>=24.4",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "boto3>=1.35",
    "pymupdf>=1.24",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-boto3>=1.35",
]
ocr = [
    "rapidocr-onnxruntime>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI 的 Depends() 必须写在默认值位置
    "RUF001", # 中文注释里的全角标点是刻意的
    "RUF002",
    "RUF003",
    # 异常类刻意不带 Error 后缀：raise NotFound() 比 raise NotFoundError() 更贴近
    # 调用点的语义，且基类 AppError 已经表明了它们的身份
    "N818",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*", "alembic.*"]
disallow_untyped_defs = false

# Celery 至今不提供 py.typed
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jieba.*", "pymupdf.*", "fitz.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py"]
